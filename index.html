<style>
:root{--bg:#cfd3c4;--paper:#e6e8dc;--ink:#15151a;--link:#1a2bcc;--seen:#6b1f8f;--red:#a4161a;
--f:"IBM Plex Sans Condensed","Arial Narrow","Avenir Next Condensed","Roboto Condensed",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 var(--f)}
main{max-width:720px;margin:0 auto;padding:14px}
a{color:var(--link)} a:visited{color:var(--seen)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1{font:600 44px/1 var(--f);letter-spacing:-1px;margin:.4em 0 .15em}
.strip{border:2px solid var(--ink);background:var(--paper);padding:4px 10px;font:16px/1.4 var(--f);min-height:34px}
.cur{animation:b 1s steps(1) infinite} @keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
nav{display:flex;margin:18px 0 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;background:var(--bg);border:2px solid var(--ink);border-bottom:0;padding:4px 18px;cursor:pointer;margin-right:-2px}
nav button[aria-selected=true]{background:var(--paper);font-weight:600;position:relative;top:2px}
section{border:2px solid var(--ink);background:var(--paper);padding:14px;min-height:240px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ink)}
.row:last-child{border-bottom:0}
.play{width:44px;height:44px;font:18px var(--f);background:var(--bg);border:2px outset #888;cursor:pointer}
.play[aria-pressed=true]{border-style:inset;background:var(--red);color:#fff}
.t{font-weight:600} .m{font:15px var(--f);opacity:.75}
.bar{grid-column:1/-1;height:10px;border:1px solid var(--ink);background:#fff;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.note{font-size:15px;border:1px solid var(--ink);padding:8px 10px;margin-top:14px}
footer{margin-top:14px;font:15px var(--f);display:flex;justify-content:space-between;gap:10px}
#visits{touch-action:manipulation;user-select:none}
#eye{background:none;border:0;font-size:18px;cursor:pointer;color:var(--ink)}
#room{display:none;margin-top:10px;border:2px solid var(--red);background:var(--paper);color:var(--red);padding:10px;font:16px var(--f)}
#room.on{display:block}
</style>

const $ = id => document.getElementById(id);
const audio = new Audio();
let playingBtn = null, playingBar = null, unlocked = false;
const TABS = ["beats","loops","kits","posts","about"];
const VERB = {beats:"download", loops:"download", kits:"get the kit", secret:"keep it"};

function el(tag, props={}, kids=[]){
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k)); return n;
}
/* used only for the secret song from files.js: "allcaps 147 @jjjayare.mp3" -> "allcaps", "147 bpm" */
function parse(name){
  let s = name.replace(/\.[^.]+$/,"").replace(/@[\w.]*/g," "), key = "";
  s = s.replace(/\b([A-Ga-g][#b]?)\s*(min(?:or)?|maj(?:or)?|[il]wato)\b/i,(m,n,q)=>{
    q = q.toLowerCase();
    key = n[0].toUpperCase()+n.slice(1)+" "+(q.startsWith("min")?"minor":q.startsWith("maj")?"major":"iwato");
    return " ";
  });
  s = s.replace(/\b(jayare|loop|bpm|mp3)\b/gi," ").replace(/\(\s*\)/g," ");
  const t = s.split(/\s+/).filter(Boolean);
  const i = t.findIndex(x => /^\d{2,3}$/.test(x) && +x>=60 && +x<=220);
  const bpm = i>-1 ? t.splice(i,1)[0] : "";
  return {title:t.join(" ")||"untitled", meta:bpm?bpm+" bpm":""};
}
function listFor(tab){
  if(tab==="kits") return KITS;
  if(SONGS[tab]) return SONGS[tab].map(([title,bpm,file]) => {
    const p = tab+"/"+encodeURIComponent(file);
    return {title, meta: bpm ? bpm+" bpm" : "", preview:p, download:p};
  });
  const names = (window.FILES && FILES[tab]) || [];
  return names.map(n => { const p = tab+"/"+encodeURIComponent(n); return Object.assign(parse(n),{preview:p,download:p}); });
}
function stop(){
  audio.pause();
  if(playingBtn){playingBtn.setAttribute("aria-pressed","false");playingBtn.textContent="\u25B6";}
  playingBtn = null;
}
function row(item, tab){
  const btn = el("button",{className:"play",textContent:"\u25B6",title:"preview"});
  btn.setAttribute("aria-pressed","false");
  btn.setAttribute("aria-label","play "+item.title);
  const fill = el("i"), bar = el("div",{className:"bar"},[fill]);
  btn.onclick = () => {
    if(playingBtn === btn){stop();return;}
    stop();
    audio.src = item.preview; audio.play().catch(()=>{});
    playingBtn = btn; playingBar = fill;
    btn.setAttribute("aria-pressed","true"); btn.textContent = "\u275A\u275A";
  };
  bar.onclick = e => {
    if(playingBtn !== btn || !audio.duration) return;
    const r = bar.getBoundingClientRect();
    audio.currentTime = audio.duration * (e.clientX - r.left) / r.width;
  };
  const dl = el("a",{href:item.download,textContent:VERB[tab]});
  if(!/^https?:/.test(item.download)) dl.setAttribute("download","");
  else {dl.target="_blank"; dl.rel="noopener";}
  return el("div",{className:"row"},[
    btn,
    el("div",{},[el("div",{className:"t",textContent:item.title}), item.meta?el("div",{className:"m",textContent:item.meta}):""]),
    dl, bar
  ]);
}
function show(tab){
  if(!TABS.includes(tab)) tab = "beats";
  stop();
  [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b.dataset.t===tab));
  const v = $("view"); v.replaceChildren();
  if(tab==="about"){
    v.append(el("p",{textContent:ABOUT.text}));
    ABOUT.links.forEach(l => v.append(el("p",{},[el("a",{href:l.url,textContent:l.label,target:"_blank",rel:"noopener"})])));
  } else {
    const list = listFor(tab);
    if(!list.length) v.append(el("p",{textContent:"Nothing here yet. Check back."}));
    list.forEach(i => v.append(row(i, tab)));
  }
  v.append(el("div",{className:"note",textContent:ABOUT.license}));
  history.replaceState(null,"","#"+tab);
}
TABS.forEach(t => {
  const b = el("button",{textContent:t}); b.dataset.t = t;
  b.setAttribute("role","tab"); b.onclick = () => show(t);
  $("tabs").append(b);
});

  if(playingBar && audio.duration) playingBar.style.width = (100*audio.currentTime/audio.duration)+"%";
});
audio.addEventListener("ended",()=>{ if(playingBar) playingBar.style.width="0"; stop(); });

$("eye").onclick = () => {

};
function found(){
  const sf = window.FILES && FILES.secret && FILES.secret[0];
  if(unlocked || !sf) return; unlocked = true;
  const r = $("room"), p = "secret/"+encodeURIComponent(sf);
  r.replaceChildren(el("p",{textContent:"you stayed. two people, one room, one take."}),
    row({title:"belly",meta:"",preview:p,download:p},"secret"));
  r.classList.add("on"); r.scrollIntoView({behavior:"smooth"});
}
let buf = "", taps = 0, tapT;
document.addEventListener("keydown",e=>{ buf = (buf+e.key).slice(-5).toLowerCase(); if(buf==="belly") found(); });
$("visits").onclick = () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(()=>taps=0, 2500);
  if(taps>=6){ taps=0; found(); }
};
